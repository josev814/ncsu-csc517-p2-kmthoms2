name: minitest

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: csc_ece_517_spring_2026_program_2_1_test
        options: >-
          --health-cmd="pg_isready -U postgres -d csc_ece_517_spring_2026_program_2_1_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.8'

      - name: Install dependencies
        run: |
          # Ensure we allow unfrozen gems
          bundle config set frozen false
          bundle install

      - name: Create and migrate the database
        run: |
          RAILS_ENV=test bundle exec rails db:create db:migrate db:seed 

      - name: Run tests
        run: |
          bundle exec rails test -f

      - name: Extract coverage percentage
        if: always()
        id: coverage
        run: |
          ruby <<'RUBY'
          require "json"

          coverage_file = "coverage/.last_run.json"
          coverage_value = nil

          if File.exist?(coverage_file)
            data = JSON.parse(File.read(coverage_file))
            coverage_value = data.dig("result", "line")
          end

          File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |f|
            if coverage_value
              f.puts("value=#{format('%.2f', coverage_value)}")
            else
              f.puts("value=unavailable")
            end
          end
          RUBY

      - name: Add coverage to run summary
        if: always()
        run: |
          echo "## Test Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "Line coverage: **${{ steps.coverage.outputs.value }}%**" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

      - name: Post coverage comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          COVERAGE_VALUE: ${{ steps.coverage.outputs.value }}
        with:
          script: |
            const marker = '<!-- coverage-comment -->';
            const body = `${marker}\n### Test Coverage\nLine coverage: **${process.env.COVERAGE_VALUE}%**`;
            const issue_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }